<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quant Racing Dashboard (Win & Exacta Focus)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--accent); }
    .badge { background: #0369a1; color: #e0f2fe; padding: 4px 8px; borderRadius: 4px; font-size: 0.8rem; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Card Panels */
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .panel h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
    
    /* Controls */
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    select, textarea, input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 15px; }
    textarea { resize: vertical; min-height: 100px; font-family: monospace; }

    .btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }

    .code-box { background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; color: var(--text-muted); }
    
    .flex-row { display: flex; gap: 12px; }
    .flex-1 { flex: 1; }
    
    .external-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .external-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏇 Quant Racing Dashboard</h1>
    <span class="badge">WIN & EXACTA ONLY</span>
  </header>

  <!-- Race Tabs 1-10 -->
  <div class="tabs" id="race-tabs"></div>

  <!-- Main Workflow Area -->
  <div id="tab-content"></div>
</div>

<script>
  const TOTAL_RACES = 10;
  let currentRace = 1;

  const vibeProfiles = {
    balanced: "STRATEGY PROFILE: Balanced Quantitative Focus. Optimize for raw score accuracy while capturing positive EV overlays.",
    conservative: "STRATEGY PROFILE: Conservative / High Probability. Favor proven class and baseline figures. Minimize longshot risk.",
    longshot: "STRATEGY PROFILE: Longshot Hunter / Max EV. Actively hunt for market inefficiencies, pace meltdowns, and high-odds overlays."
  };

  // Initialize Tabs
  function initTabs() {
    const tabsContainer = document.getElementById('race-tabs');
    tabsContainer.innerHTML = '';
    for (let i = 1; i <= TOTAL_RACES; i++) {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${i === currentRace ? 'active' : ''}`;
      btn.innerText = `Race ${i}`;
      btn.onclick = () => switchRace(i);
      tabsContainer.appendChild(btn);
    }
  }

  function switchRace(raceNum) {
    currentRace = raceNum;
    initTabs();
    renderRacePanel();
  }

  function getSelectedVibe(raceNum) {
    const select = document.getElementById(`vibe-select-${raceNum}`);
    return select ? select.value : 'balanced';
  }

  function generatePrompt1(raceNum) {
    const vibeKey = getSelectedVibe(raceNum);
    const vibeText = vibeProfiles[vibeKey];

    return `ROLE & TASK:
You are an expert quantitative horse racing handicapper analyzing Race ${raceNum} from the attached Past Performances PDF.

${vibeText}

CRITICAL HANDICAPPING RULES:
1. PACE & SURFACE PHYSICS:
   - Dirt Races: Check for multiple early front-runners. If a fast pace duel is projected, penalize front-runners and boost deep closers.
   - Turf Races: Prioritize Late Pace (LP) speed ratings and turn-of-foot over early speed.
2. FORM AUDIT & FORGIVENESS:
   - Do NOT penalize horses with proven back-class for a single bad trip (bumped, wide turn, bad break).
   - Give extra weight to positive state changes: 1st-time Lasix, new geldings, or 3rd start off a layoff.
3. DEVELOPING 3YO UPSIDE:
   - Lightly-raced 3-year-olds facing older horses have uncapped growth potential; do not strictly limit them by outdated juvenile speed figures.
4. WAGERING FOCUS (STRICT):
   - Restrict ALL evaluation and wager recommendations strictly to **WIN** and **EXACTA** bets. Ignore Trifectas, Superfectas, and Multi-Race wagers.

OUTPUT FORMAT:
Provide your concise race analysis followed by this exact format:

### RACE ${raceNum} TOP 4 CONTENDERS (Detailed)
For Ranks 1 through 4, provide a brief 2-sentence breakdown covering: Speed/Class, Pace Style, and Key Rationale.

### REMAINING FIELD (Single-Line Scrub)
For Ranks 5+, provide ONLY a 1-line summary: "#[No.] [Name]: [1-sentence reason for lower rank]"

### STRUCTURED SUMMARY CODE BLOCK
\`\`\`text
RACE: ${raceNum}
MODEL: [Model Name]
HORSE_SCORES:
#1 [Name]: Score=[X]/100 | Style=[Frontrunner/Presser/Closer] | Rationale=[1 sentence]
... [List all horses in field]
PACE_PREDICTION: [Slow / Fast / Contested Meltdown]
\`\`\``;
  }

  function generatePrompt2(raceNum) {
    const liveText = document.getElementById(`live-odds-${raceNum}`)?.value || '';
    
    return `You are analyzing Race ${raceNum}. 

Below is the live track data (scratches, surface changes, and live odds) copied directly from the tote board:

=== RAW LIVE DATA START ===
${liveText}
=== RAW LIVE DATA END ===

INSTRUCTIONS:
1. Update the field: Strip out all scratched horses and recalibrate winning probabilities for active runners.
2. Identify Value Overlays: Compare actual live tote odds to model expected win probabilities. Flag any horse where Live Odds > Fair Model Odds.
3. OUTPUT WAGERING RECOMMENDATIONS (STRICTLY WIN & EXACTA ONLY):
   - **PRIMARY WIN BET:** Specify the best Expected Value (EV) win wager (e.g., $10 Win on #X).
   - **EXACTA STRUCTURES:** Output specific, actionable tickets using Straight, Box, or Key Wheel builds (e.g., $2 Exacta Box X-Y, or $2 Exacta Key #X OVER #A, #B, #C).
   - Do NOT generate Trifectas, Superfectas, or Multi-Race bets.`;
  }

  function renderRacePanel() {
    const container = document.getElementById('tab-content');
    container.innerHTML = `
      <!-- Step 1: Base Analysis -->
      <div class="panel">
        <h2>
          <span>Step 1: Base PDF Analysis (Prompt 1)</span>
          <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted)">Send to Gemini with PDF</span>
        </h2>
        
        <label for="vibe-select-${currentRace}">Strategy Profile:</label>
        <select id="vibe-select-${currentRace}" onchange="updatePrompt1Text(${currentRace})">
          <option value="balanced" selected>Balanced Quantitative (Default)</option>
          <option value="conservative">Conservative / High Probability</option>
          <option value="longshot">Longshot Hunter / Max EV</option>
        </select>

        <label>Generated Prompt 1:</label>
        <div class="code-box" id="p1-text-${currentRace}"></div>
        <br>
        <button class="btn" onclick="copyToClipboard('p1-text-${currentRace}')">📋 Copy Prompt 1</button>
      </div>

      <!-- Step 2: Live Odds & Prompt 2 -->
      <div class="panel">
        <h2>
          <span>Step 2: Live Odds Calibration (Prompt 2)</span>
          <a href="https://www.drf.com/news/live-odds-and-results" target="_blank" class="external-link">🏇 DRF Live Odds Board ↗</a>
        </h2>

        <label for="live-odds-${currentRace}">Paste Raw Live Data (Scratches, Track Condition, Odds):</label>
        <textarea id="live-odds-${currentRace}" placeholder="Paste raw text from DRF Live Odds board here..."></textarea>
        
        <div class="flex-row">
          <button class="btn" onclick="updatePrompt2Text(${currentRace})">⚙️ Generate Live Prompt 2</button>
          <button class="btn btn-secondary" onclick="copyToClipboard('p2-text-${currentRace}')">📋 Copy Prompt 2</button>
        </div>

        <br>
        <label>Generated Prompt 2:</label>
        <div class="code-box" id="p2-text-${currentRace}">Select 'Generate Live Prompt 2' after pasting odds.</div>
      </div>

      <!-- Step 3: Results Logger -->
      <div class="panel">
        <h2>
          <span>Step 3: Official Payoff & Post-Mortem Logger</span>
          <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted)">Optional Post-Race Audit</span>
        </h2>
        <label for="results-${currentRace}">Paste Official Finish & Payoff String:</label>
        <textarea id="results-${currentRace}" placeholder="e.g., Finish: 4-3-2-5. Win $10.88, Exacta $34.96..."></textarea>
        <button class="btn btn-secondary" onclick="alert('Race ${currentRace} audit saved to session log!')">💾 Save Race Audit</button>
      </div>
    `;

    updatePrompt1Text(currentRace);
  }

  function updatePrompt1Text(raceNum) {
    const text = generatePrompt1(raceNum);
    const elem = document.getElementById(`p1-text-${raceNum}`);
    if (elem) elem.innerText = text;
  }

  function updatePrompt2Text(raceNum) {
    const text = generatePrompt2(raceNum);
    const elem = document.getElementById(`p2-text-${raceNum}`);
    if (elem) elem.innerText = text;
  }

  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("Copied to clipboard!");
    });
  }

  // App Start
  initTabs();
  renderRacePanel();
</script>

</body>
</html>
